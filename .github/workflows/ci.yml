name: Quality Net CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality-net:
    name: "API Quality Net (RSpec Suite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: "test_secret_key_base_32_bytes_minimum_length_required"
      DB_HOST: "localhost"
      DB_PORT: "5432"
      DB_NAME: "rakamin_test"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "password"
      ALLOWED_ORIGINS: "*"
      REDIS_URL: "redis://localhost:6379/1"
      GEMINI_API_KEY: "test_dummy_key"
      GEMINI_LIVE_MODEL: "gemini-live-test"
      GEMINI_FLASH_MODEL: "gemini-flash-test"
      GEMINI_PRO_MODEL: "gemini-pro-test"
      APP_BASE_URL: "http://localhost:3001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.2
          bundler-cache: true
          working-directory: api

      - name: Setup Database Schema
        run: |
          bundle exec rails db:create db:migrate

      - name: Run Quality Net RSpec Suite
        run: |
          bundle exec rspec

  web-quality-net:
    name: "Web Quality Net (Typecheck & Contract Suite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Type Check & Build
        run: npm run build

      - name: Run Web Contract Tests
        run: npm test
